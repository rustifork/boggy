[package]
name = "boggy"
version = "0.5.0"
edition = "2021"
authors = ["rustifork"]
license = "MIT OR Apache-2.0"
description = "Lightweight agentless IoT network vulnerability scanner for Raspberry Pi"
repository = "https://github.com/rustifork/boggy"
readme = "README.md"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
