name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Tests
        run: cargo test
      - name: Database validation
        run: python3 -c "import json; assert len(json.load(open('db/cves.json'))) > 500; assert len(json.load(open('db/creds.json'))['generic']['http']) > 20"

  build:
    needs: check
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          elif [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Size check
        run: |
          sz=$(stat -c%s target/${{ matrix.target }}/release/boggy)
          echo "size=$sz"
          test "$sz" -lt 5242880
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boggy-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/boggy
